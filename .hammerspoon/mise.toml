[tools]
stylua = "2.6.0"
lua = "5.4.9"
lua-language-server = "3.19.2"

[tasks.fmt]
description = "Format Lua files"
run = "stylua ."

[tasks."fmt:check"]
description = "Fail if Lua files are not formatted"
run = "stylua --check ."

[tasks.lint]
description = "Lint Lua files"
run = "lua-language-server --check . --checklevel=Warning --check_format=pretty --type-check --config .luarc.json"

[tasks.test]
description = "Run unit tests outside Hammerspoon"
run = "lua run_tests.lua"

[tasks.check]
description = "Check formatting, lint and tests"
depends = ["fmt:check", "lint", "test"]
